<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 110" width="480" height="110" fill="none">
  <defs>
    <linearGradient id="brand-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B6B" />
      <stop offset="100%" stop-color="#FF8E53" />
    </linearGradient>
  </defs>

  <style>
    .adaptive-stroke { stroke: #24292f; }
    .adaptive-fill { fill: #24292f; }
    .bracket-stroke { stroke: #94a3b8; }
    @media (prefers-color-scheme: dark) {
      .adaptive-stroke { stroke: #F8FAFC; }
      .adaptive-fill { fill: #F8FAFC; }
      .bracket-stroke { stroke: #475569; }
    }
  </style>

  <!-- Headless Engine Icon Mark (Left) -->
  <g transform="translate(24, 15) scale(0.65)">
    <!-- Side framing brackets -->
    <path class="bracket-stroke" d="M 20 28 L 20 92 M 140 28 L 140 92" stroke-width="6" stroke-linecap="round" />
    
    <!-- Razor-sharp H geometry -->
    <path class="adaptive-stroke" d="M 48 10 L 48 110 M 112 10 L 112 110 M 48 60 L 112 60" stroke-width="14" stroke-linecap="round" stroke-linejoin="miter"/>
    
    <!-- Accent nodes -->
    <circle cx="48" cy="10" r="11" fill="url(#brand-accent)" />
    <circle cx="112" cy="110" r="11" fill="url(#brand-accent)" />
  </g>

  <!-- Typography (Right) -->
  <g transform="translate(145, 62)">
    <text class="adaptive-fill" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', Helvetica, Arial, sans-serif" font-size="44" letter-spacing="-1.2px">
      <tspan font-weight="900">headless</tspan><tspan font-weight="300" opacity="0.85">-engine</tspan>
    </text>
    <text fill="#FF6B6B" x="2" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="2px">
      ULTRA-LIGHTWEIGHT BROWSER RUNTIME
    </text>
  </g>
</svg>
