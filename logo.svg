<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" width="500" height="120" fill="none">
  
  <!-- Minimalist Headless Engine Logo -->
  <g transform="translate(10, 10) scale(0.35)">
    <!-- Clean, razor-sharp H geometry -->
    <path d="M 64 48 L 64 208 M 192 48 L 192 208 M 64 128 L 192 128" stroke="#F8FAFC" stroke-width="20" stroke-linecap="square" stroke-linejoin="miter"/>
    <!-- Accent nodes -->
    <circle cx="64" cy="48" r="16" fill="#f78166" />
    <circle cx="192" cy="208" r="16" fill="#f78166" />
    <!-- Minimalist framing box -->
    <path d="M 32 80 L 32 176 M 224 80 L 224 176" stroke="#F8FAFC" stroke-width="8" stroke-linecap="square" />
  </g>

  <!-- Typography (White for Dark Mode) -->
  <text x="120" y="76" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="52" fill="#F8FAFC" letter-spacing="-1.5px">
    <tspan font-weight="900">headless</tspan><tspan font-weight="300">-engine</tspan>
  </text>
  
</svg>
