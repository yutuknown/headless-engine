<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" fill="none">
  <style>
    .adaptive-stroke { stroke: #24292f; }
    .adaptive-fill { fill: #24292f; }
    @media (prefers-color-scheme: dark) {
      .adaptive-stroke { stroke: #F8FAFC; }
      .adaptive-fill { fill: #F8FAFC; }
    }
  </style>

  <!-- Minimalist Headless Engine Logo (Centered) -->
  <g transform="translate(136, 40) scale(0.5)">
    <!-- Clean, razor-sharp H geometry -->
    <path class="adaptive-stroke" d="M 64 48 L 64 208 M 192 48 L 192 208 M 64 128 L 192 128" stroke-width="20" stroke-linecap="square" stroke-linejoin="miter"/>
    <!-- Accent nodes -->
    <circle cx="64" cy="48" r="16" fill="#f78166" />
    <circle cx="192" cy="208" r="16" fill="#f78166" />
    <!-- Minimalist framing box -->
    <path class="adaptive-stroke" d="M 32 80 L 32 176 M 224 80 L 224 176" stroke-width="8" stroke-linecap="square" />
  </g>

  <!-- Typography (Centered below logo) -->
  <text class="adaptive-fill" x="200" y="240" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="48" letter-spacing="-1.5px">
    <tspan font-weight="900">headless</tspan><tspan font-weight="300">-engine</tspan>
  </text>
  
</svg>
