name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: write

jobs:
  build-release:
    name: Build release binary - ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64 (AMD64)
            target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact_name: headless-engine
            asset_name: headless-engine-linux-x86_64.tar.gz
          - name: Linux ARM64 (aarch64)
            target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            artifact_name: headless-engine
            asset_name: headless-engine-linux-arm64.tar.gz
          - name: macOS Intel (x86_64)
            target: x86_64-apple-darwin
            os: macos-13
            artifact_name: headless-engine
            asset_name: headless-engine-macos-x86_64.tar.gz
          - name: macOS Apple Silicon (arm64)
            target: aarch64-apple-darwin
            os: macos-latest
            artifact_name: headless-engine
            asset_name: headless-engine-macos-arm64.tar.gz
          - name: Windows x86_64 (AMD64)
            target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact_name: headless-engine.exe
            asset_name: headless-engine-windows-x86_64.zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install ARM64 cross-linker (Linux ARM64 only)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build release binary
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --release --target ${{ matrix.target }} --bin headless-engine

      - name: Package Unix Archive (.tar.gz)
        if: matrix.os != 'windows-latest'
        run: |
          cd target/${{ matrix.target }}/release
          tar -czf ../../../${{ matrix.asset_name }} ${{ matrix.artifact_name }}
          cd ../../..

      - name: Package Windows Archive (.zip)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          Compress-Archive -Path target/${{ matrix.target }}/release/${{ matrix.artifact_name }} -DestinationPath ${{ matrix.asset_name }}

      - name: Generate Checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash -Path "${{ matrix.asset_name }}" -Algorithm SHA256).Hash.ToLower()
          Set-Content -Path "${{ matrix.asset_name }}.sha256" -Value $hash -NoNewline

      - name: Upload binaries to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ matrix.asset_name }}
            ${{ matrix.asset_name }}.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-crates-io:
    name: Publish to Crates.io
    needs: build-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Publish to crates.io
        if: env.CARGO_REGISTRY_TOKEN != ''
        run: cargo publish --token ${{ secrets.CARGO_REGISTRY_TOKEN }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
